b\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 1B — Strip Network/Plan Codes&amp;lt;br&amp;gt;Remove PPO, HMO, POS II, HDHP, etc. (fixed generic list only)&amp;lt;br&amp;gt;Example: &amp;amp;quot;AETNA CHOICE POS II&amp;amp;quot; → &amp;amp;quot;AETNA CHOICE&amp;amp;quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;110\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;500\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s2\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 2 — Resolve State&amp;lt;br&amp;gt;1) State embedded in the name?  2) Else fall back to Lab State&amp;lt;br&amp;gt;Example: &amp;amp;quot;Aetna&amp;amp;quot; has no state in the text → falls back to Lab State = UT\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;110\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;640\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s3\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 3 — Resolve Program Type&amp;lt;br&amp;gt;Medicare / Medicaid / Commercial / Exchange / Federal / Dual, from keywords in the text\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;90\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;780\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s4\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 4 — Family Classification (Blocking Key)&amp;lt;br&amp;gt;Groups the name under a brand family so scoring only compares relevant candidates&amp;lt;br&amp;gt;Example: &amp;amp;quot;AETNA&amp;amp;quot; → Aetna family (1 record: Global ID 1001)\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;110\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;900\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s5\&quot; parent=\&quot;1\&quot; style=\&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#FFF2CC;strokeColor=#D6B656;fontSize=12;\&quot; value=\&quot;STEP 5 — Exact Match in PayerAlias?&amp;lt;br&amp;gt;Key = (CanonicalName + Resolved State)\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;150\&quot; width=\&quot;280\&quot; x=\&quot;340\&quot; y=\&quot;1040\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s6\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 6 — Candidate Selection&amp;lt;br&amp;gt;Narrow the Payer Policy Master to the matched family (or all active records if family is unknown)\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;100\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;1230\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s7\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 7 — Fuzzy Scoring&amp;lt;br&amp;gt;Blended text similarity + state adjustment (+8 / −20) + program-type adjustment (+5 / −10)&amp;lt;br&amp;gt;Example: &amp;amp;quot;AETNA&amp;amp;quot; vs &amp;amp;quot;Aetna&amp;amp;quot; (Global ID 1001, no state on file) → score ≈ 100\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;130\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;1370\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s8\&quot; parent=\&quot;1\&quot; style=\&quot;rhombus;whiteSpace=wrap;html=1;fillColor=#FFF2CC;strokeColor=#D6B656;fontSize=12;\&quot; value=\&quot;STEP 8 — Confidence Tier?\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;150\&quot; width=\&quot;280\&quot; x=\&quot;340\&quot; y=\&quot;1540\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;humanReview\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#FFF2CC;strokeColor=#D6B656;fontSize=12;spacing=6;\&quot; value=\&quot;Human Review&amp;lt;br&amp;gt;Reports Analyst / LRN Admin reviews the Top 5 ranked candidates&amp;lt;br&amp;gt;Approve or Manual Map → writes the mapping.  Reject → stays Unmapped.\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;120\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;1740\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;s9\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#F5F5F5;strokeColor=#666666;fontSize=12;spacing=6;\&quot; value=\&quot;STEP 9 — Persist + Update Alias Table&amp;lt;br&amp;gt;Writes Global_Payer_ID to the Lab record&amp;lt;br&amp;gt;Adds a NEW row to PayerAlias: (AETNA, UT) → 1001&amp;lt;br&amp;gt;Next UT lab sending &amp;amp;quot;Aetna&amp;amp;quot; will hit Step 5 directly\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;130\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;1900\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;endAuto\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D5E8D4;strokeColor=#82B366;fontSize=13;fontStyle=1;\&quot; value=\&quot;AUTO-MAPPED&amp;lt;br&amp;gt;Global_Payer_ID = 1001 written automatically, no person involved\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;80\&quot; width=\&quot;320\&quot; x=\&quot;320\&quot; y=\&quot;2070\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;staysUnmapped\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F8CECC;strokeColor=#B85450;fontSize=13;fontStyle=1;\&quot; value=\&quot;STAYS UNMAPPED&amp;lt;br&amp;gt;&amp;amp;quot;No Mapping Payer Found in Payer Policy Master&amp;amp;quot;&amp;lt;br&amp;gt;No escalation email — intentional business decision\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;120\&quot; width=\&quot;340\&quot; x=\&quot;800\&quot; y=\&quot;1740\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note1\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#999999;dashed=1;fontSize=11;align=left;verticalAlign=top;spacing=8;\&quot; value=\&quot;&amp;lt;div&amp;gt;&amp;lt;u style=&amp;quot;font-weight: bold;&amp;quot;&amp;gt;Product Line Rules - (Supporting master table)&amp;lt;/u&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;b&amp;gt;&amp;lt;u&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/u&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;This master contains ReGex patterns used to remove Plan / Network codes in the raw payer name&amp;lt;br&amp;gt;&amp;lt;br&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;EXAMPLE — Plan Name Stripping&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;Raw: &amp;quot;AETNA - CHOICE (POS II)&amp;quot;&amp;lt;br&amp;gt;After 1A: &amp;quot;AETNA CHOICE POS II&amp;quot;&amp;lt;br&amp;gt;After 1B: &amp;quot;AETNA CHOICE&amp;quot;&amp;lt;br&amp;gt;Removing &amp;quot;POS II&amp;quot; alone moved the final match score from 93.75 (Manual Review) to 96.32 (Auto-Map)\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;170\&quot; width=\&quot;358\&quot; x=\&quot;851\&quot; y=\&quot;300\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;note2\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=0;whiteSpace=wrap;html=1;fillColor=#FFFFFF;strokeColor=#999999;dashed=1;fontSize=11;align=left;verticalAlign=top;spacing=8;\&quot; value=\&quot; r this run, PayerAlias gains: (AETNA, UT) → 1001&amp;lt;br&amp;gt;The next lab in Utah sending &amp;amp;quot;Aetna&amp;amp;quot; skips straight to Step 5 and Auto-Maps instantly\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;150\&quot; width=\&quot;360\&quot; x=\&quot;800\&quot; y=\&quot;1900\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legSwatch1\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#D5E8D4;strokeColor=#82B366;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;24\&quot; width=\&quot;24\&quot; x=\&quot;320\&quot; y=\&quot;2210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legText1\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;\&quot; value=\&quot;Auto-Map outcome\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;24\&quot; width=\&quot;220\&quot; x=\&quot;352\&quot; y=\&quot;2210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legSwatch2\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#FFF2CC;strokeColor=#D6B656;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;24\&quot; width=\&quot;24\&quot; x=\&quot;600\&quot; y=\&quot;2210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legText2\&quot; parent=\&quot;1\&quot; style=\&quot;text;html=1;align=left;verticalAlign=middle;fontSize=12;\&quot; value=\&quot;Manual Review outcome\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;24\&quot; width=\&quot;220\&quot; x=\&quot;632\&quot; y=\&quot;2210\&quot; as=\&quot;geometry\&quot;/&gt;&lt;/mxCell&gt;&lt;mxCell id=\&quot;legSwatch3\&quot; parent=\&quot;1\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;fillColor=#F8CECC;strokeColor=#B85450;\&quot; value=\&quot;\&quot; vertex=\&quot;1\&quot;&gt;&lt;mxGeometry height=\&quot;24\&quot
