# Static hosting for the built SPA. TLS, compression at the edge and any auth
# terminate at the ingress in front of this container.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Client-side routing: any path that is not a real file is the app's own route,
    # so hand it index.html and let the router resolve it. Without this, a refresh on
    # a deep link returns a bare 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets (name.<hash>.js), so those files are
    # immutable - a change produces a new name. index.html must NOT be cached this
    # way or a deploy leaves browsers loading the previous bundle forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml font/woff font/woff2;

    # Plain 200 for orchestrator probes, without falling through to index.html.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
